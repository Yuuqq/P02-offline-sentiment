<!doctype html>
  <html lang="zh-CN">
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>P02 离线情感分析仪</title>
    <link rel="stylesheet" href="../shared/design-tokens.css"/>
    <link rel="stylesheet" href="./styles.css"/>
    <meta name="description" content="离线双语情感分析：中英文词库、进度条、逐句分析、情感词高亮、导出报告。"/>
    <link rel="manifest" href="./manifest.json"/>
  </head>
  <body>
    <main aria-label="主内容区域" class="app">
      <header class="hero">
        <h1>离线情感分析仪</h1>
        <p>中英双语词库，逐句分析情感倾向，高亮关键词，可导出分析报告。</p>
      </header>

      <section class="card">
        <details class="teach-card" open>
          <summary>🎓 新闻情感分析与框架偏见</summary>
          <p>相同事件的报道，因用词选择不同可产生截然不同的情感基调。情感分析可量化文本的正负倾向，帮助识别<strong>框架偏见</strong>（Framing Bias）。注意：本工具基于词袋模型，无法处理讽刺、双重否定等复杂语境，结论仅供参考。</p>
        </details>
      </section>

      <section class="split-grid">
        <article class="card">
          <label for="textInput">输入新闻文本（最多 3000 字）</label>
          <textarea id="textInput" rows="14" placeholder="粘贴新闻报道…" aria-label="新闻文本输入"></textarea>
          <div class="btn-row">
            <button id="analyzeBtn" type="button">分析情感</button>
            <button id="exportBtn" type="button" class="export-btn" disabled>导出报告</button>
            <button id="clearBtn" type="button" class="clear-btn">清空</button>
          </div>
          <p id="status" role="status" aria-live="polite">状态: 输入文本后点击分析</p>

          <div class="bars-section">
            <div class="bar-row">
              <span class="bar-label">🟢 正面</span>
              <div class="bar-track"><div id="posBar" class="bar-fill bar-pos"></div></div>
              <span id="posVal" class="bar-val">0%</span>
            </div>
            <div class="bar-row">
              <span class="bar-label">🔴 负面</span>
              <div class="bar-track"><div id="negBar" class="bar-fill bar-neg"></div></div>
              <span id="negVal" class="bar-val">0%</span>
            </div>
            <div class="bar-row">
              <span class="bar-label">⚪ 中性</span>
              <div class="bar-track"><div id="neutralBar" class="bar-fill bar-neu"></div></div>
              <span id="neutralVal" class="bar-val">0%</span>
            </div>
          </div>

          <div id="summary" class="summary-box"></div>
        </article>

        <article class="card">
          <label>情感词高亮</label>
          <div id="highlightOutput" class="highlight-area"></div>
          <label style="margin-top:14px">逐句情感分析（前12句）</label>
          <ul id="sentenceList" class="sent-list"></ul>
        </article>
      </section>
    </main>

    <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">🔒 所有分析均在浏览器本地完成，不上传任何数据。</div>
    <nav style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
      <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
      <span style="opacity:.4">P02</span>
    </nav>
    <script src="./pm-metrics.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="../shared/dark-toggle.js" defer></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
    <script src="../shared/cmd-palette.js" defer></script>
    <script src="../shared/toast.js" defer></script>
    <script src="../shared/onboarding.js" defer></script>
    <script src="../shared/pedagogy-data-p1.js" defer></script>
    <script src="../shared/pedagogy-data-p2.js" defer></script>
    <script src="../shared/global-nav.js" defer></script>
    <script src="../shared/kbd-hints.js" defer></script>
  </body>
  </html>
